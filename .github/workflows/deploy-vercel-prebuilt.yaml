name: Deploy Vercel Prebuilt (Linux)

# 仅手动触发（workflow_dispatch），零 push 触发。
# 目的：绕开 Vercel Git-integration 云端构建的 nitro/pnpm 闭包追踪回归，
# 在 Linux 上构建自包含 prebuilt 产物后直接部署（repro R53/F41 实证：
# Linux 产物 symlink 为相对路径可移植；Windows 产物绝对路径换机即断）。
# 使用前需在仓库 Secrets 配置：VERCEL_TOKEN、VERCEL_ORG_ID、VERCEL_PROJECT_ID。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Linux build + vercel deploy --prebuilt
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装冻结依赖
        run: pnpm install --frozen-lockfile

      - name: 强制 fresh 串行构建并搬运产物到仓库根
        run: pnpm exec turbo run do-build-nuxt-doc --force --concurrency=1

      - name: 校验产物闭包自包含（symlink 必须为相对或零）
        run: |
          ABS=$(find .vercel/output/functions -type l -lname '/*' | wc -l)
          echo "absolute symlinks = $ABS"
          test "$ABS" -eq 0

      - name: 部署 prebuilt 到生产
        run: npx vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
